{% include base_path %}

<!-- start custom head snippets -->

<!-- Google Fonts: Inter for body, Source Serif for accents -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Custom styles -->
<style>
  /* ===== Publication cards ===== */
  .publication-card {
    background: var(--global-code-background-color);
    border: 1px solid var(--global-border-color);
    border-radius: 8px;
    padding: 1.25em 1.5em;
    margin-bottom: 1.25em;
    transition: all 0.2s ease-in-out;
  }
  .publication-card:hover {
    border-color: var(--global-link-color);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .publication-card h2.archive__item-title {
    font-size: 1.05em;
    margin-top: 0;
    margin-bottom: 0.3em;
  }
  .publication-card p {
    margin-bottom: 0.5em;
    font-size: 0.92em;
  }
  .publication-card .pub-venue {
    color: var(--global-link-color);
    font-weight: 500;
    font-size: 0.88em;
  }
  .publication-card .pub-links a {
    display: inline-block;
    padding: 0.25em 0.75em;
    margin-right: 0.4em;
    margin-top: 0.4em;
    font-size: 0.82em;
    font-weight: 500;
    border: 1px solid var(--global-link-color);
    border-radius: 4px;
    color: var(--global-link-color);
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .publication-card .pub-links a:hover {
    background: var(--global-link-color);
    color: #fff;
  }

  /* ===== About page research highlights ===== */
  .page__content h1 {
    font-size: 1.4em;
    letter-spacing: -0.01em;
    margin-top: 2em;
    padding-bottom: 0.3em;
    border-bottom: 2px solid var(--global-link-color);
  }

  /* ===== Refined interest tags ===== */
  .page__content ul {
    padding-left: 0;
  }
  .page__content > ul > li {
    list-style: none;
    position: relative;
    padding-left: 1.2em;
  }
  .page__content > ul > li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.6em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--global-link-color);
  }

  /* ===== Smoother hr ===== */
  .page__content hr {
    border: 0;
    height: 1px;
    background: linear-gradient(to right, var(--global-border-color), transparent);
    margin: 1.5em 0;
  }

  /* ===== Author sidebar polish ===== */
  .author__avatar img {
    transition: all 0.3s ease;
  }
  .author__avatar img:hover {
    transform: scale(1.03);
  }
  .author__bio {
    font-size: 0.9em;
    color: var(--global-text-color-light);
    line-height: 1.5;
  }
  .author__urls a {
    transition: color 0.2s ease;
  }
  .author__urls a:hover {
    color: var(--global-link-color) !important;
  }

  /* ===== Section heading accent for publications page ===== */
  .archive h2 {
    font-size: 1.15em;
    letter-spacing: -0.01em;
    color: var(--global-text-color);
    border-bottom: 2px solid var(--global-link-color);
    padding-bottom: 0.35em;
    margin-bottom: 1em;
  }

  /* ===== Masthead refinement ===== */
  .masthead {
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.92);
  }
  html[data-theme="dark"] .masthead {
    background: rgba(30,33,41,0.92);
  }

  /* ===== Selection color ===== */
  ::selection {
    background: var(--global-link-color);
    color: #fff;
  }
</style>

<!-- end custom head snippets -->
